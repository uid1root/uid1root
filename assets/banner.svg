<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="0.6" stop-color="#13293d"/>
      <stop offset="1" stop-color="#1c2f3f"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fa4ff"/>
      <stop offset="0.5" stop-color="#7ee0c3"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fa4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2fa4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>

  <!-- texto -->
  <text x="60" y="118" fill="#7ee0c3" font-size="16" font-weight="600" letter-spacing="4">OLÁ, EU SOU</text>
  <text x="60" y="170" fill="#ffffff" font-size="46" font-weight="700">Vinicius Cavalcanti</text>
  <text x="60" y="212" fill="#cfd8e3" font-size="21">Head de Platform Engineering &amp; DevOps</text>
  <text x="60" y="242" fill="#cfd8e3" font-size="21">Professor &amp; Coordenador · MBA Impacta</text>
  <rect x="60" y="270" width="64" height="4" rx="2" fill="#ff9900"/>
  <text x="60" y="310" fill="#8fa3b8" font-size="17" font-style="italic">Onde tecnologia encontra pessoas e estratégia.</text>

  <!-- brilhos -->
  <circle cx="730" cy="200" r="150" fill="url(#glowL)"/>
  <circle cx="990" cy="200" r="150" fill="url(#glowR)"/>

  <!-- infinito DevOps <-> Gestão -->
  <path d="M860 200 C 800 105, 620 105, 620 200 C 620 295, 800 295, 860 200 C 920 105, 1100 105, 1100 200 C 1100 295, 920 295, 860 200 Z"
        fill="none" stroke="url(#loop)" stroke-width="10" stroke-linecap="round"/>

  <!-- etapas DevOps (lado esquerdo) -->
  <g fill="#2fa4ff">
    <circle cx="668" cy="139" r="6"/><circle cx="625" cy="225" r="6"/>
    <circle cx="700" cy="270" r="6"/><circle cx="790" cy="140" r="6"/>
  </g>
  <g fill="#9cc9ee" font-size="12" font-weight="600" letter-spacing="1">
    <text x="640" y="122">CODE</text>
    <text x="574" y="250">BUILD</text>
    <text x="680" y="296">DEPLOY</text>
    <text x="780" y="122">MONITOR</text>
  </g>
  <text x="740" y="196" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">DEVOPS</text>
  <text x="740" y="220" fill="#9cc9ee" font-size="12" text-anchor="middle">cloud · automação</text>

  <!-- etapas Gestão (lado direito) -->
  <g fill="#ff9900">
    <circle cx="930" cy="140" r="6"/><circle cx="1052" cy="139" r="6"/>
    <circle cx="1095" cy="225" r="6"/><circle cx="1020" cy="270" r="6"/>
  </g>
  <g fill="#ffcc80" font-size="12" font-weight="600" letter-spacing="1">
    <text x="886" y="122">PESSOAS</text>
    <text x="1030" y="122">ESTRATÉGIA</text>
    <text x="1110" y="230">CULTURA</text>
    <text x="984" y="296">RESULTADOS</text>
  </g>
  <text x="980" y="196" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">GESTÃO</text>
  <text x="980" y="220" fill="#ffcc80" font-size="12" text-anchor="middle">times · negócios</text>

  <!-- ponto de encontro -->
  <circle cx="860" cy="200" r="13" fill="#0b1622" stroke="#7ee0c3" stroke-width="4"/>
  <circle cx="860" cy="200" r="4" fill="#7ee0c3"/>
  <text x="860" y="352" fill="#7ee0c3" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle">PLATFORM ENGINEERING</text>
  <line x1="860" y1="216" x2="860" y2="334" stroke="#7ee0c3" stroke-opacity="0.4" stroke-dasharray="3 5"/>
</svg>
